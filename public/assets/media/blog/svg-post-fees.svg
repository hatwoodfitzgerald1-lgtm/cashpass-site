<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="A bar of the year's card earnings with two fee blocks that come off, landing on $749 net">
<defs>
<radialGradient id="fp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E9F1F8" stop-opacity="0.3"/><stop offset="1" stop-color="#E9F1F8" stop-opacity="0"/></radialGradient>
</defs>
<text x="360" y="48" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="22" fill="#F5EDE8" text-anchor="middle">Earned $1,069. Fees $320. The fee comes off.</text>
<path d="M60 244 H660" stroke="#CDB3AE" stroke-opacity="0.4" stroke-width="1"/>
<g id="earnings"><g id="earn-1"><rect x="60" y="150" width="206.2" height="44" rx="6" fill="#5E1F22" stroke="#CDB3AE" stroke-opacity="0.35" stroke-width="1"/><text x="163.1" y="177" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle" style="font-variant-numeric:tabular-nums"><tspan font-size="12.8" dy="-1.2">$</tspan><tspan dy="1.2"></tspan>371</text><text x="163.1" y="214" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="middle">Grocery 6%</text></g><g id="earn-2"><rect x="268.2" y="150" width="132.7" height="44" rx="6" fill="#4E181A" stroke="#CDB3AE" stroke-opacity="0.35" stroke-width="1"/><text x="334.6" y="177" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle" style="font-variant-numeric:tabular-nums"><tspan font-size="12.8" dy="-1.2">$</tspan><tspan dy="1.2"></tspan>240</text><text x="334.6" y="214" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="middle">Everyday 4%</text></g><g id="earn-3"><rect x="402.9" y="150" width="99" height="44" rx="6" fill="#3E1113" stroke="#CDB3AE" stroke-opacity="0.35" stroke-width="1"/><text x="452.5" y="177" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle" style="font-variant-numeric:tabular-nums"><tspan font-size="12.8" dy="-1.2">$</tspan><tspan dy="1.2"></tspan>180</text><text x="452.5" y="214" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="middle">Rotating 5%</text></g><g id="earn-4"><rect x="504" y="150" width="48.5" height="44" rx="6" fill="#5E1F22" stroke="#CDB3AE" stroke-opacity="0.35" stroke-width="1"/><text x="528.2" y="177" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle" style="font-variant-numeric:tabular-nums"><tspan font-size="12.8" dy="-1.2">$</tspan><tspan dy="1.2"></tspan>90</text><text x="528.2" y="232" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="middle">Marketplace 5%</text></g><g id="earn-5"><rect x="554.5" y="150" width="103.5" height="44" rx="6" fill="#4E181A" stroke="#CDB3AE" stroke-opacity="0.35" stroke-width="1"/><text x="606.2" y="177" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle" style="font-variant-numeric:tabular-nums"><tspan font-size="12.8" dy="-1.2">$</tspan><tspan dy="1.2"></tspan>188</text><text x="606.2" y="214" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="middle">Flat 2%</text></g></g>
<g id="fees"><g id="fee-1" class="fee"><rect x="212.9" y="150" width="53.3" height="44" rx="6" fill="#2E0B0C" stroke="#CDB3AE" stroke-width="1.75" stroke-dasharray="4 3"/><text x="239.6" y="142" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="12" fill="#CDB3AE" text-anchor="middle" style="font-variant-numeric:tabular-nums">fee <tspan font-size="10.2" dy="-1">$</tspan><tspan dy="1"></tspan>95</text></g><g id="fee-2" class="fee"><rect x="274.7" y="150" width="126.3" height="44" rx="6" fill="#2E0B0C" stroke="#CDB3AE" stroke-width="1.75" stroke-dasharray="4 3"/><text x="337.8" y="142" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="12" fill="#CDB3AE" text-anchor="middle" style="font-variant-numeric:tabular-nums">fee <tspan font-size="10.2" dy="-1">$</tspan><tspan dy="1"></tspan>225</text></g></g>
<ellipse cx="360.0" cy="352" rx="260" ry="20" fill="url(#fp)"/>
<g id="net"><text x="360" y="336" font-family="'Instrument Serif', Georgia, serif" font-weight="400" font-size="60" fill="#E9F1F8" text-anchor="middle">$749 net after fees</text></g>
<text x="360" y="380" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="15" fill="#CDB3AE" text-anchor="middle">One flat 2% card on everything: $558. Ahead by $191.</text>
<text x="696" y="464" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="end">Example figures</text>
</svg>
