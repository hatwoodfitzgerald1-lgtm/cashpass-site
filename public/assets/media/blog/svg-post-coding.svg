<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" role="img" aria-label="Two small storefronts, a supermarket and a cafe, with a pool of light that moves from the Grocery 6% card to the Everyday 4% card">
<defs>
<radialGradient id="cp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E9F1F8" stop-opacity="0.35"/><stop offset="1" stop-color="#E9F1F8" stop-opacity="0"/></radialGradient>
</defs>
<text x="360" y="48" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="22" fill="#F5EDE8" text-anchor="middle">Where you stand decides how it codes.</text>
<g id="store-market" fill="none" stroke="#CDB3AE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="80" y="120" width="220" height="100" rx="3"/><path d="M74 120 h232 l-6 -18 h-220 z"/><path d="M80 120 q18.3 14 36.7 0 M116.7 120 q18.3 14 36.7 0 M153.3 120 q18.3 14 36.7 0 M190 120 q18.3 14 36.7 0 M226.7 120 q18.3 14 36.7 0 M263.3 120 q18.3 14 36.7 0 "/><rect x="96" y="142" width="188" height="46" rx="3"/><path d="M190.0 142 v46"/><path d="M104 202 h172" stroke-dasharray="3 5"/></g><text x="190" y="250" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle">Lantern Row Market</text><text x="190" y="270" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="13" fill="#CDB3AE" text-anchor="middle">codes as Grocery</text>
<g id="store-cafe" fill="none" stroke="#CDB3AE" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="420" y="120" width="220" height="100" rx="3"/><path d="M414 120 h232 l-6 -18 h-220 z"/><path d="M420 120 q18.3 14 36.7 0 M456.7 120 q18.3 14 36.7 0 M493.3 120 q18.3 14 36.7 0 M530 120 q18.3 14 36.7 0 M566.7 120 q18.3 14 36.7 0 M603.3 120 q18.3 14 36.7 0 "/><rect x="438" y="146" width="184" height="40" rx="3"/><path d="M450 196 h160" /><rect x="520.0" y="182" width="20" height="14" rx="3"/></g><text x="530" y="250" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="15" fill="#F5EDE8" text-anchor="middle">Lantern Row Cafe</text><text x="530" y="270" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="13" fill="#CDB3AE" text-anchor="middle">codes as Dining</text>
<rect x="60" y="404" width="600" height="1" fill="#E9F1F8" opacity="0.18"/>
<ellipse id="pool" cx="190" cy="405" rx="130" ry="18" fill="url(#cp)"/>
<g id="tile-grocery" class="lit"><rect x="115" y="306" width="150" height="94" rx="8" fill="#E9F1F8"/><text x="129" y="336" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="16" fill="#2E0B0C" text-anchor="start">Grocery 6%</text><text x="129" y="384" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#2E0B0C" text-anchor="start">ending 4471</text></g><g id="tile-everyday" class="unlit"><rect x="455" y="306" width="150" height="94" rx="8" fill="#5E1F22"/><text x="469" y="336" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="16" fill="#CDB3AE" text-anchor="start">Everyday 4%</text><text x="469" y="384" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="start">ending 0286</text></g>
<text x="360" y="452" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="13" fill="#CDB3AE" text-anchor="middle">A few steps apart, a different card.</text>
