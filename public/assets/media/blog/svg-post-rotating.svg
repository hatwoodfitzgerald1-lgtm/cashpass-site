<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="A ring of four quarters with the current one lit and a small activate switch inside">
<defs>
<radialGradient id="rp" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#E9F1F8" stop-opacity="0.35"/><stop offset="1" stop-color="#E9F1F8" stop-opacity="0"/></radialGradient>
</defs>
<text x="320" y="40" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="22" fill="#F5EDE8" text-anchor="middle">The quarter turns. Activate before it opens.</text>
<ellipse cx="320" cy="398" rx="220" ry="16" fill="url(#rp)"/>
<g id="ring"><g id="seg-q1" class="unlit"><path d="M327.9 76.2 A150 150 0 0 1 469.8 218.1 L403.9 221.6 A84 84 0 0 0 324.4 142.1 Z" fill="none" stroke="#CDB3AE" stroke-width="1.75" stroke-linejoin="round"/><text x="402.7" y="150.3" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="20" fill="#CDB3AE" text-anchor="middle">Q1</text></g><g id="seg-q2" class="unlit"><path d="M469.8 233.9 A150 150 0 0 1 327.9 375.8 L324.4 309.9 A84 84 0 0 0 403.9 230.4 Z" fill="none" stroke="#CDB3AE" stroke-width="1.75" stroke-linejoin="round"/><text x="402.7" y="315.7" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="20" fill="#CDB3AE" text-anchor="middle">Q2</text></g><g id="seg-q3" class="unlit"><path d="M312.1 375.8 A150 150 0 0 1 170.2 233.9 L236.1 230.4 A84 84 0 0 0 315.6 309.9 Z" fill="none" stroke="#CDB3AE" stroke-width="1.75" stroke-linejoin="round"/><text x="237.3" y="315.7" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="20" fill="#CDB3AE" text-anchor="middle">Q3</text></g><g id="seg-q4" class="lit"><path d="M170.2 218.1 A150 150 0 0 1 312.1 76.2 L315.6 142.1 A84 84 0 0 0 236.1 221.6 Z" fill="#E9F1F8" stroke="#E9F1F8" stroke-width="1.75" stroke-linejoin="round"/><text x="237.3" y="150.3" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="600" font-size="20" fill="#2E0B0C" text-anchor="middle">Q4</text></g></g>
<g id="toggle"><rect x="286" y="210" width="68" height="32" rx="16" fill="#5E1F22" stroke="#CDB3AE" stroke-width="1.75"/><circle id="knob" cx="338" cy="226" r="11" fill="#E9F1F8"/></g>
<text x="320" y="422" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="16" fill="#CDB3AE" text-anchor="middle">Activated: Q1, Q2, Q3</text><text x="320" y="444" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="16" fill="#CDB3AE" text-anchor="middle">Q4 opens Oct 1</text>
<text x="616" y="464" font-family="'Familjen Grotesk', system-ui, sans-serif" font-weight="500" font-size="12" fill="#CDB3AE" text-anchor="end">Example figures</text>
</svg>
