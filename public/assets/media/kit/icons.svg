<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0" height="0" style="position:absolute" aria-hidden="true">
<style>svg{color:#CDB3AE} .icon{fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round} .icon .fill{fill:currentColor;stroke:none} .icon .thick{stroke-width:2.5} .icon .faint{opacity:.55} .icon .pip{fill:#E9F1F8;stroke:none} .icon .badge{fill:#E9F1F8;stroke:none} .is-lit{color:#E9F1F8}</style>
<symbol id="icon-card" viewBox="0 0 20 20"><title>a card: the tile with its digits bar</title><g class="icon"><rect x="2.5" y="4.5" width="15" height="11" rx="3"/><path d="M5.5 12.5h4"/></g></symbol>
<symbol id="icon-phone" viewBox="0 0 20 20"><title>a phone with a notification pip</title><g class="icon"><rect x="5.5" y="1.5" width="9" height="17" rx="3"/><path d="M8.5 15.5h3"/><circle cx="14.5" cy="4.5" r="1.6" class="pip"/></g></symbol>
<symbol id="icon-reader" viewBox="0 0 20 20"><title>a card reader: three concentric arcs</title><g class="icon"><rect x="2.5" y="2.5" width="15" height="15" rx="3"/><path d="M7.5 12.5a3.5 3.5 0 0 1 5 0"/><path d="M5.8 10.6a6 6 0 0 1 8.4 0"/><path d="M10 14.6h.01"/></g></symbol>
<symbol id="icon-rule" viewBox="0 0 20 20"><title>a rule: a card with an arrow to a small awning</title><g class="icon"><rect x="1.5" y="6.5" width="8" height="6" rx="1.8"/><path d="M11 9.5h3"/><path d="M12.8 7.8l1.7 1.7-1.7 1.7"/><path d="M15 4.5h4v3l-1 1.5h-2l-1-1.5z"/><path d="M16 9v3.5h2V9"/></g></symbol>
<symbol id="icon-quarter" viewBox="0 0 20 20"><title>a quarter: a square split in four with one quadrant filled</title><g class="icon"><rect x="2.5" y="2.5" width="15" height="15" rx="3"/><path d="M10 2.5v15M2.5 10h15"/><path d="M10 10h7.5v4.5a3 3 0 0 1-3 3H10z" class="fill"/></g></symbol>
<symbol id="icon-cap" viewBox="0 0 20 20"><title>a cap: a bar two thirds filled</title><g class="icon"><rect x="1.5" y="7.5" width="17" height="5" rx="2.5"/><rect x="1.5" y="7.5" width="11.5" height="5" rx="2.5" class="fill"/></g></symbol>
<symbol id="icon-ledger" viewBox="0 0 20 20"><title>a ledger: three stacked bars with a longer total</title><g class="icon"><path d="M3.5 4.5h7M3.5 8.5h9M3.5 12.5h6"/><path d="M3.5 16.5h13" class="thick"/></g></symbol>
<symbol id="icon-token" viewBox="0 0 20 20"><title>a token: a small key shaped tile with a notch</title><g class="icon"><rect x="2.5" y="6.5" width="10" height="7" rx="3"/><path d="M12.5 10h5v2.5M15.5 10v2"/><circle cx="6.5" cy="10" r="1" class="fill"/></g></symbol>
<symbol id="icon-household" viewBox="0 0 20 20"><title>a household: five dots on an arc</title><g class="icon"><path d="M2.5 14a7.5 7.5 0 0 1 15 0" class="faint"/><circle cx="2.5" cy="14" r="1.4" class="fill"/><circle cx="5.3" cy="9" r="1.4" class="fill"/><circle cx="10" cy="6.5" r="1.4" class="fill"/><circle cx="14.7" cy="9" r="1.4" class="fill"/><circle cx="17.5" cy="14" r="1.4" class="fill"/></g></symbol>
<symbol id="icon-wallet-link" viewBox="0 0 20 20"><title>a wallet link: two tiles joined by a short bar</title><g class="icon"><rect x="1.5" y="5.5" width="7" height="9" rx="2"/><rect x="11.5" y="5.5" width="7" height="9" rx="2"/><path d="M8.5 10h3"/></g></symbol>
<symbol id="icon-tick" viewBox="0 0 20 20"><title>a tick inside the card</title><g class="icon"><rect x="2.5" y="4.5" width="15" height="11" rx="3"/><path d="M6.5 10.2l2.3 2.3 4.7-5"/></g></symbol>
<symbol id="icon-cart" viewBox="0 0 20 20"><title>the cart: a card outline with a count badge</title><g class="icon"><rect x="2.5" y="5.5" width="13" height="10" rx="3"/><path d="M5.5 12.5h4"/><circle cx="15.5" cy="5.5" r="3" class="badge"/></g></symbol>
<symbol id="icon-light" viewBox="0 0 20 20"><title>the light: a small pool under a dot</title><g class="icon"><circle cx="10" cy="7" r="1.8" class="fill"/><ellipse cx="10" cy="14" rx="6.5" ry="2.2"/><path d="M10 9v2.5"/></g></symbol>
</svg>
